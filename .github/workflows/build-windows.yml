name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: ['meow']
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build NUP GUI
        shell: pwsh
        run: ./tools/nup/build_windows.ps1
      - name: Smoke test the Windows GUI event loop
        run: python tools/nup/smoke_gui.py dist/nup-gui.exe
      - name: Verify pack and unpack preserve file bytes
        run: python -m unittest discover -s tools/nup/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: nup-gui-windows-x64
          path: dist/nup-gui-windows-x64.zip
          if-no-files-found: error
